<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Visual Compare | ResQTrace AI"><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}"><style>
.compare-layout{display:grid;grid-template-columns:minmax(250px,340px) 1fr;gap:22px;margin:24px 0}.compare-card{background:#fff;border:1px solid #e3e9e5;border-radius:18px;padding:22px;box-shadow:0 8px 24px #173b2910}.compare-card h2{margin-top:0}.compare-card label{display:block;font-weight:600;margin:16px 0 7px}.compare-card select{width:100%;padding:12px;border:1px solid #cbd8d0;border-radius:10px;background:#fff}.compare-card button{margin-top:18px;width:100%}.compare-results{display:grid;grid-template-columns:1fr 1fr;gap:14px}.compare-results img{width:100%;max-height:320px;object-fit:contain;background:#f2f5f3;border-radius:12px}.metric-large{font-size:34px;font-weight:800;color:#176b50}.warning-note{background:#fff6df;border:1px solid #f0d68a;border-radius:12px;padding:14px;margin-top:16px}.muted{color:#68776e;font-size:14px}.error-note{background:#fff0ed;padding:12px;border-radius:10px;color:#9a3412;margin-bottom:12px}@media(max-width:800px){.compare-layout{grid-template-columns:1fr}.compare-results{grid-template-columns:1fr}}
</style><link rel="stylesheet" href="{{ url_for('static', filename='css/redesign-v2.css') }}"></head><body class="dashboard-body"><header class="site-header dashboard-header"><nav class="nav container"><a class="brand" href="{{ url_for('dashboard') }}">ResQTrace <span class="brand-ai">AI</span></a><div class="dashboard-nav"><a href="{{ url_for('image_analysis') }}">Image analysis</a><a href="{{ url_for('memory_map') }}">Disaster Memory</a><a href="{{ url_for('conditions_watch') }}">Conditions Watch</a><a href="{{ url_for('dashboard') }}">Dashboard</a><a href="{{ url_for('search_recommendations') }}">Search Recommendations</a></div></nav></header><main class="dashboard-main container"><div class="dashboard-heading"><div><div class="section-kicker">PHASE 7 / OBSERVATION COMPARISON</div><h1>Visual <span>change review.</span></h1><p>Compare two uploads from the same zone and highlight pixel-level differences.</p></div></div><div class="compare-layout"><section class="compare-card"><h2>Select observations</h2>{% if error %}<div class="error-note">{{ error }}</div>{% endif %}<form method="get" action="{{ url_for('visual_compare') }}"><label for="zone_name">Zone</label><select id="zone_name" name="zone_name" required><option value="">Choose zone</option>{% for zone in zones %}<option value="{{ zone.zone_name }}" {% if selected_zone == zone.zone_name %}selected{% endif %}>{{ zone.zone_name }} ({{ zone.image_count }} uploads)</option>{% endfor %}</select><button class="button button-secondary" type="submit">Load zone images</button></form>{% if selected_zone %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="zone_name" value="{{ selected_zone }}"><label for="older_id">Earlier image</label><select id="older_id" name="older_id" required><option value="">Choose earlier observation</option>{% for image in images %}<option value="{{ image.id }}">#{{ image.id }} · {{ image.original_name }} · {{ image.created_at }}</option>{% endfor %}</select><label for="newer_id">Later image</label><select id="newer_id" name="newer_id" required><option value="">Choose later observation</option>{% for image in images %}<option value="{{ image.id }}">#{{ image.id }} · {{ image.original_name }} · {{ image.created_at }}</option>{% endfor %}</select><button class="button button-primary" type="submit">Compare images</button></form>{% endif %}<p class="muted">Choose two different uploads assigned to the same zone. Images from similar angles and scales produce more useful comparisons.</p></section><section class="compare-card"><h2>Comparison result</h2>{% if comparison %}<div class="metric-large">{{ comparison.change_pct }}% <span style="font-size:16px;font-weight:600">pixels differ</span></div><p class="muted">Mean grayscale difference: {{ comparison.mean_difference }} / 255</p><div class="compare-results"><div><h3>Earlier</h3><p>{{ comparison.older.original_name }}</p><img src="{{ url_for('analysis_image', analysis_id=comparison.older.id) }}" alt="Earlier observation"></div><div><h3>Later</h3><p>{{ comparison.newer.original_name }}</p><img src="{{ url_for('analysis_image', analysis_id=comparison.newer.id) }}" alt="Later observation"></div></div><h3>Difference heatmap</h3><img style="width:100%;max-height:300px;object-fit:contain;background:#f2f5f3;border-radius:12px" src="data:image/png;base64,{{ comparison.diff_data }}" alt="Grayscale pixel difference heatmap"><div class="warning-note">{{ comparison.warning }}</div>{% else %}<p class="muted">Select two observations and click Compare images. The results and heatmap will appear here.</p>{% endif %}</section></div><footer class="dashboard-footer"><span>ResQTrace AI · Student prototype</span><span>Human verification required</span></footer></main></body></html>
